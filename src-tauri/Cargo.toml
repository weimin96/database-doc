[package]
name = "database-doc"
version = "0.1.0"
edition = "2021"

[lib]
name = "database_doc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "json", "macros"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
ring = "0.17"

[dev-dependencies]

# macOS 27 拒绝加载当前 Rust 工具链剥离调试信息后的部分过程宏 dylib。
# 保留构建依赖的调试信息；不影响应用二进制的发布优化。
[profile.release.build-override]
debug = true
strip = "none"
